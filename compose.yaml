services:
  frontend:
    image: devmhimran/taskbit:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    develop:
      watch:
        - path: ./package.json
          action: rebuild
        - path: ./yarn.lock
          action: rebuild
        - path: .
          target: /app
          action: sync
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydb}}

      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-taskbit_super_secret_auth_key_12345}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_AUTH_SECRET=${NEXT_PUBLIC_AUTH_SECRET:-taskbit_super_secret_auth_key_12345}
      - NEXT_PUBLIC_JWT_ACCESS_SECRET=${NEXT_PUBLIC_JWT_ACCESS_SECRET:-taskbit_jwt_access_secret_12345}
      - NEXT_PUBLIC_JWT_REFRESH_SECRET=${NEXT_PUBLIC_JWT_REFRESH_SECRET:-taskbit_jwt_refresh_secret_12345}

      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - APP_BASE_URL=${APP_BASE_URL}

      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - NEXT_PUBLIC_SHEET_URL=${NEXT_PUBLIC_SHEET_URL}
      - NEXT_PUBLIC_APP_NOT_SHIFTED=${NEXT_PUBLIC_APP_NOT_SHIFTED}
    depends_on:
      - db

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "yarn prisma generate && yarn prisma studio"
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydb}}
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - POSTGRES_DB=${POSTGRES_DB:-mydb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
